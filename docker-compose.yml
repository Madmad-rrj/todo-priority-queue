services:
  postgres:
    image: postgres:16
    container_name: todo-stack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: todo_stack_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: todo_dev_password
    ports:
      - "5433:5432"
    volumes:
      - todo-stack-postgres-data:/var/lib/postgresql/data

volumes:
  todo-stack-postgres-data:
